<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora Courier</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#172333;color:#eafbf2;font-family:Arial,sans-serif}#view{display:block;width:100vw;height:100vh}#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 0 12px #75e8d58a}.brand{position:absolute;top:25px;left:30px;font-size:12px;letter-spacing:5px;color:#f5c891}.telemetry{position:absolute;left:30px;top:66px;display:flex;gap:25px}.metric small{display:block;font-size:10px;letter-spacing:2px;color:#9dd3ce}.metric strong{font-size:38px;font-weight:400}.metric em{font-size:10px;font-style:normal;color:#a1c3c4}.compass{position:absolute;left:50%;top:24px;transform:translateX(-50%);text-align:center;width:330px;overflow:hidden}.compass #heading{font-size:27px;color:#ffdda6}.compass-window{height:28px;overflow:hidden;border-top:1px solid #91d8ce66;margin-top:5px}#compass-track{white-space:nowrap;width:1900px;text-align:left;position:relative;left:145px;font:12px monospace;letter-spacing:2px}.systems{position:absolute;right:30px;top:28px;width:165px}.system{margin-bottom:17px;font:10px monospace;letter-spacing:1px}.system span{float:right}.track{height:4px;background:#193f49;margin-top:7px}.track b{display:block;height:100%;background:#84f9d9;box-shadow:0 0 10px #84f9d9}#damage-bar{background:#ff9270}.mission{position:absolute;left:30px;bottom:35px;border-left:2px solid #fbc78b;padding-left:15px}.eyebrow{font-size:10px;letter-spacing:3px;color:#9ac4c4}.mission h3{font-size:24px;font-weight:400;margin:8px 0;color:#ffdb9f}.mission p{font:11px monospace;color:#badbd5}#instruments{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:230px;height:160px}.clock{position:absolute;right:30px;bottom:35px;text-align:right}.clock strong{font:29px monospace;color:#ffdda6}.clock small{display:block;font:10px monospace;letter-spacing:3px;margin:7px 0}#warning{position:absolute;top:145px;left:50%;transform:translateX(-50%);color:#ffd181;font:13px monospace;letter-spacing:2px;animation:pulse 1s infinite alternate}.help{position:absolute;bottom:8px;left:30px;font:9px monospace;color:#9bbabc}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#101e32db,#17223950)}.panel{width:920px;padding:40px}.panel .kicker{color:#f6ca91;font-size:12px;letter-spacing:6px}.panel h1{font-size:68px;font-weight:300;margin:14px 0 6px;letter-spacing:-2px}.panel .intro{color:#bdd5d5;font-size:16px;line-height:1.7;max-width:640px}.contracts{display:flex;gap:14px;margin:30px 0}.contract{flex:1;text-align:left;background:#163b48b8;border:1px solid #8ebfb76b;color:#f4f5dc;padding:24px 18px;cursor:pointer;transition:.2s}.contract:hover{background:#32605b;border-color:#ffcf8d;transform:translateY(-3px)}.contract b{display:block;font-size:21px;font-weight:400;color:#ffdcaa}.contract span{display:block;font-size:11px;line-height:1.7;color:#b5d6d2;margin-top:10px}.contract i{display:block;font:10px monospace;color:#83ddbe;margin-top:16px;font-style:normal}.controls{font:12px monospace;line-height:2;color:#b9d1d2}.button{border:1px solid #d4bd91;background:#f5cc97;color:#1e3542;padding:13px 24px;cursor:pointer;margin:15px 10px 0 0;font:12px monospace}.result-stats{display:flex;gap:45px;margin:25px 0;color:#a7d2cd}.result-stats strong{display:block;color:#ffe0aa;font:28px monospace}.hidden{display:none!important}@keyframes pulse{to{opacity:.45}}
/* Keep result figures clear of the fuel ring visible in the background. */
.result-stats{transform:translateX(160px)}
</style></head><body>
<canvas id="view"></canvas>
<!-- Flight telemetry stays readable independently of terrain brightness. -->
<div id="hud"><div class="brand">AURORA / COURIER</div><div class="telemetry"><div class="metric"><small>AIRSPEED</small><strong id="speed">95</strong><em> KT</em></div><div class="metric"><small>ALTITUDE AGL</small><strong id="altitude">180</strong><em> M</em></div><div class="metric"><small>VERTICAL</small><strong id="vertical">0</strong><em> M/S</em></div></div><div class="compass"><div id="heading">000°</div><div class="compass-window"><div id="compass-track">N · · · · · · · · E · · · · · · · · S · · · · · · · · W · · · · · · · · N · · · · · · · · E</div></div></div><div class="systems"><div class="system">THROTTLE <span id="throttle-value"></span><div class="track"><b id="throttle-bar"></b></div></div><div class="system">FUEL <span id="fuel-value"></span><div class="track"><b id="fuel-bar"></b></div></div><div class="system">DAMAGE <span id="damage-value"></span><div class="track"><b id="damage-bar"></b></div></div></div><div id="warning"></div><div class="mission"><div class="eyebrow">ACTIVE CONTRACT / EMBER VALLEY</div><h3 id="mission-name"></h3><p id="objective"></p></div><canvas id="instruments" width="230" height="160"></canvas><div class="clock"><small>FLIGHT TIME</small><strong id="timer"></strong><small>CONTRACT SCORE</small><strong id="score"></strong></div><div class="help">W/S THROTTLE · ARROWS FLY · SPACE DROP · P PAUSE</div></div>
<div id="overlay"><div class="panel" id="panel"></div></div><script type="module" src="./src/main.js"></script></body></html>
